name: Sign-in UI

# Loads the committed wallet bundle (public/javascripts/siwe.iife.js) in
# Chromium against a local Discourse stand-in and signs in with a test
# wallet, then checks the bundle is what ui/ builds. No secrets, no network
# beyond installing packages and the browser.
on:
  push:
    branches: [main, staging]
    paths:
      ['ui/**', 'public/javascripts/**', '.github/workflows/sign-in-ui.yml']
  pull_request:
    paths:
      ['ui/**', 'public/javascripts/**', '.github/workflows/sign-in-ui.yml']

permissions:
  contents: read

jobs:
  sign-in-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Sign in with the committed bundle
        run: npm run test:e2e
        env:
          CI: '1'
      - name: Build (type-check, build, no missing-package stubs)
        run: npm run build
      - name: The committed bundle is what ui/ builds
        run: git diff --exit-code --stat -- ../public/javascripts/siwe.iife.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            ui/e2e/playwright-report
            ui/e2e/test-results
          retention-days: 7
