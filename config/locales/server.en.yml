en:
  site_settings:
    discourse_siwe_enabled: 'Enable Sign In With Ethereum authentication'
    siwe_project_id: 'Project ID for Web3Modal'
    siwe_ethereum_rpc_url: 'Ethereum RPC URL — required for ENS name/avatar resolution and EIP-1271 smart contract wallet verification (e.g. SAFE). A dedicated endpoint (Alchemy, Infura) is recommended.'
    siwe_statement: 'Statement that will be displayed in the SIWE message'
    siwe_society_enabled: 'Enable Society Protocol identity resolution and the display-identity toggle'
    siwe_society_subgraph_url: 'Society Protocol subgraph URL (optional; falls back to direct RPC if blank or failing)'
    siwe_society_subgraph_token: 'Bearer token for the Society query gateway (GRAPH_QUERY_GATEWAY_TOKEN). Without it the gateway rejects lookups and profile names do not resolve.'
    siwe_society_badges_contract: 'Society Protocol Badges (ERC-1155) contract address'
    siwe_society_badges_rpc_url: 'RPC URL used to read badge balances, when different from the SIWE RPC (for example Sepolia on staging). Falls back to the Ethereum RPC URL.'
    siwe_society_badges_chain_id: 'Chain id the badges contract lives on (1 mainnet, 11155111 Sepolia). When set, group sync refuses to run against any other chain. 0 skips the check.'
    siwe_group_sync_mode: 'Badge to group sync: off, log (report what would change, change nothing) or enforce.'
    siwe_group_badge_mapping: 'Which badge feeds which group, as badge_id:group pairs separated by | (for example 13:governors|14:vip|15:vip|16:vip). A member holding any badge of a group belongs to it. Automatic groups (admins, moderators, staff, trust levels) are refused.'
    siwe_group_sync_exempt_usernames: 'Usernames the group sync never removes from a group (staff and group owners are always exempt).'
    siwe_group_sync_removal_floor: 'Brake: never remove more than this many members from one group in a single run (or the percentage below, whichever is larger). When exceeded, nobody is removed from that group.'
    siwe_group_sync_removal_percent: 'Brake: percentage of a group that may be removed in a single run.'
    siwe_group_sync_removal_confirmations: 'A member must be seen without the badge this many runs in a row before removal.'
    siwe_identity_resolution_mode: 'Preferred resolution mode for Society Protocol identities'
